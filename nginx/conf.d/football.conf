# 足球搭子 - Nginx 反向代理
# 灰度期先用 IP，后续替换域名

upstream football_backend {
    server backend:3000;
}

upstream football_admin {
    server admin-web:80;
}

# HTTP → 强制 HTTPS（灰度期可注释）
server {
    listen 80;
    server_name _;

    # 灰度期先开放 HTTP（小程序测试号勾选"不校验域名"）
    location / {
        proxy_pass http://football_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后台管理 Web（Vue3 SPA）
    # 访问路径：http://footballdazi.com/admin/
    location /admin/ {
        proxy_pass http://football_admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # admin-web 静态资源（2026-07-30 修复：vite build 没用 base='/admin/'，HTML 引用 /assets/...）
    location /assets/ {
        proxy_pass http://football_admin/assets/;
        proxy_set_header Host $host;
    }

    # admin-web favicon
    location = /favicon.ico {
        proxy_pass http://football_admin/favicon.ico;
    }

    # 后台 API 反代（admin-web 内部已配 /api/，走 backend）
    location /api/ {
        proxy_pass http://football_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/payment/notify {
        proxy_pass http://football_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 文件上传大小
    client_max_body_size 20M;
}

