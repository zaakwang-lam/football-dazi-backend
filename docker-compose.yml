# 足球搭子 - 云服务器一键部署
# 使用方法：
#   docker compose up -d
#   docker compose logs -f backend

version: "3.8"

services:
  # ========== MySQL 8 ==========
  mysql:
    image: mysql:8.0
    container_name: football-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Football@2026}
      MYSQL_DATABASE: football_dazi
      MYSQL_USER: football
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Football@2026}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-Football@2026}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 后端 API ==========
  backend:
    build: ./backend
    volumes:
      - ./backend/src:/app/src                  # 源码热重载（Node.js 自动重载）
      - ./backend/logs:/app/logs
      - ./backend/certs:/app/certs
    container_name: football-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: football_dazi
      DB_USER: football
      DB_PASSWORD: ${MYSQL_PASSWORD:-Football@2026}
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-prod}
      JWT_EXPIRES_IN: 7d
      WX_APPID: ${WX_APPID}
      WX_SECRET: ${WX_SECRET}
      WX_MCHID: ${WX_MCHID}
      WX_PAY_KEY: ${WX_PAY_KEY}
      WX_NOTIFY_URL: ${WX_NOTIFY_URL}
      WX_TEMPLATE_ID_BOOK: ${WX_TEMPLATE_ID_BOOK}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:alpine
    container_name: football-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx

  # ========== 后台管理 Web（Vue3 SPA） ==========
  admin-web:
    build: ./admin-web
    volumes:
      - ./admin-web/src:/app/src                      # 源码热重载（Vite HMR）
      - ./admin-web/index.html:/app/index.html
      - ./admin-web/package.json:/app/package.json
      - ./admin-web/node_modules:/app/node_modules
    container_name: football-admin-web
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
    driver: local